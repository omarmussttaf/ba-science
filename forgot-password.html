<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">

    <title>BA Science | استعادة كلمة المرور</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

<main class="auth-page">

    <div class="auth-wrapper">

        <section class="auth-brand-panel">

            <a href="./index.html" class="auth-logo">
                <img src="./images/logo.svg"
                     alt="BA Science">
            </a>

            <div class="auth-brand-content">

                <h1
                    data-ar="استعد الوصول إلى عالمك العلمي"
                    data-en="Restore Access to Your Scientific World">
                    استعد الوصول إلى عالمك العلمي
                </h1>

                <p
                    data-ar="سنساعدك على استعادة الوصول إلى حسابك بطريقة آمنة."
                    data-en="We will help you securely recover access to your account.">
                    سنساعدك على استعادة الوصول إلى حسابك بطريقة آمنة.
                </p>

            </div>

        </section>

        <section class="auth-form-panel">

            <div class="auth-form-box">

                <div class="auth-top">

                    <div>
                        <span>BA SCIENCE</span>

                        <h2
                            data-ar="نسيت كلمة المرور؟"
                            data-en="Forgot Password?">
                            نسيت كلمة المرور؟
                        </h2>
                    </div>

                    <button
                        id="languageButton"
                        class="language-button"
                        type="button">
                        EN
                    </button>

                </div>

                <form id="forgotPasswordForm"
                      class="auth-form">

                    <div class="form-group">

                        <label
                            for="recoveryEmail"
                            data-ar="البريد الإلكتروني"
                            data-en="Email Address">
                            البريد الإلكتروني
                        </label>

                        <input
                            id="recoveryEmail"
                            name="email"
                            type="email"
                            autocomplete="email"
                            maxlength="254"
                            required
                            placeholder="example@email.com">

                    </div>

                    <button
                        type="submit"
                        class="auth-submit"
                        data-ar="إرسال رابط الاستعادة"
                        data-en="Send Recovery Link">
                        إرسال رابط الاستعادة
                    </button>

                    <p id="recoveryMessage"
                       role="status"
                       aria-live="polite"></p>

                </form>

                <p class="auth-switch">

                    <a href="./login.html"
                       data-ar="العودة إلى تسجيل الدخول"
                       data-en="Back to Sign In">
                        العودة إلى تسجيل الدخول
                    </a>

                </p>

            </div>

        </section>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/password-recovery.js"></script>

</body>
</html>
