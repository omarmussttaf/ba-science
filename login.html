<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <!-- =====================================================
         BA SCIENCE
         File: login.html

         Purpose:
         Allows existing BA users to sign in securely.

         Handles:
         - Email
         - Password
         - Arabic / English interface
         - Navigation to account creation
         - Future password recovery entry point

         Security Notes:
         - Password authentication is handled by Supabase Auth.
         - Passwords are never stored manually by BA.
         - HTML validation improves UX only.
         - auth.js handles client-side validation and login logic.
         - No private API keys or secrets belong in this file.
    ====================================================== -->


    <!-- =========================
         BASIC META
    ========================= -->

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <meta
        name="referrer"
        content="strict-origin-when-cross-origin"
    >


    <title>
        BA Science | تسجيل الدخول
    </title>



    <!-- =========================
         FONTS
    ========================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >




    <!-- BA STYLES -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/auth.css">

</head>


<body>


    <!-- =========================
         AUTH PAGE
    ========================= -->

    <main class="auth-page">


        <div class="auth-wrapper">



            <!-- =========================
                 BRAND PANEL
            ========================= -->

            <section
                class="auth-brand-panel"
                aria-label="BA Science"
            >


                <a
                    href="./index.html"
                    class="auth-logo"
                    aria-label="BA Science Home"
                >

                    <img
                        src="./images/logo.svg"
                        alt="BA Science"
                    >

                </a>



                <div class="auth-brand-content">


                    <span
                        class="section-label"

                        data-ar="مرحبًا بعودتك"
                        data-en="Welcome Back"
                    >
                        مرحبًا بعودتك
                    </span>



                    <h1
                        data-ar="عد إلى عالمك العلمي"
                        data-en="Return to Your Scientific World"
                    >
                        عد إلى عالمك العلمي
                    </h1>



                    <p
                        data-ar="تابع أبحاثك، ملاحظاتك، مكتبتك العلمية والباحثين الذين تتابعهم من مكان واحد."
                        data-en="Continue exploring your research, notes, scientific library, and the researchers you follow from one place."
                    >
                        تابع أبحاثك، ملاحظاتك، مكتبتك العلمية
                        والباحثين الذين تتابعهم من مكان واحد.
                    </p>


                </div>


            </section>



            <!-- =========================
                 LOGIN PANEL
            ========================= -->

            <section class="auth-form-panel">


                <div class="auth-form-box">



                    <!-- =========================
                         FORM HEADER
                    ========================= -->

                    <div class="auth-top">


                        <div>


                            <span
                                data-ar="BA"
                                data-en="BA"
                            >
                                BA
                            </span>


                            <h2
                                data-ar="تسجيل الدخول"
                                data-en="Sign In"
                            >
                                تسجيل الدخول
                            </h2>


                        </div>



                        <button
                            class="language-button"

                            id="languageButton"

                            type="button"

                            aria-label="Switch to English"
                        >
                            EN
                        </button>


                    </div>



                    <!-- =========================
                         LOGIN FORM
                    ========================= -->

                    <form
                        class="auth-form"

                        id="loginForm"

                        autocomplete="on"
                    >



                        <!-- =========================
                             EMAIL
                        ========================= -->

                        <div class="form-group">


                            <label
                                for="loginEmail"

                                data-ar="البريد الإلكتروني"
                                data-en="Email Address"
                            >
                                البريد الإلكتروني
                            </label>



                            <input
                                type="email"

                                id="loginEmail"

                                name="email"

                                required

                                maxlength="254"

                                autocomplete="username"

                                inputmode="email"

                                autocapitalize="none"

                                spellcheck="false"

                                placeholder="name@example.com"
                            >


                        </div>



                        <!-- =========================
                             PASSWORD
                        ========================= -->

                        <div class="form-group">


                            <div class="password-label-row">


                                <label
                                    for="loginPassword"

                                    data-ar="كلمة المرور"
                                    data-en="Password"
                                >
                                    كلمة المرور
                                </label>



                                <!--
                                    BA Science password recovery.
                                    Uses Supabase Auth and a dedicated
                                    password reset page.
                                -->

                                <a
                                    href="./forgot-password.html"
                                    class="forgot-password"
                                    data-ar="نسيت كلمة المرور؟"
                                    data-en="Forgot Password?"
                                >
                                    نسيت كلمة المرور؟
                                </a>


                            </div>



                            <input
                                type="password"

                                id="loginPassword"

                                name="password"

                                required

                                maxlength="128"

                                autocomplete="current-password"

                                placeholder="••••••••"
                            >


                        </div>



                        <!-- =========================
                             SUBMIT
                        ========================= -->

                        <button
                            type="submit"

                            class="auth-submit"

                            data-ar="تسجيل الدخول"
                            data-en="Sign In"
                        >
                            تسجيل الدخول
                        </button>


                    </form>



                    <!-- =========================
                         CREATE ACCOUNT
                    ========================= -->

                    <p class="auth-switch">


                        <span
                            data-ar="ليس لديك حساب؟"
                            data-en="Don't have an account?"
                        >
                            ليس لديك حساب؟
                        </span>



                        <a
                            href="./signup.html"

                            data-ar="إنشاء حساب"
                            data-en="Create Account"
                        >
                            إنشاء حساب
                        </a>


                    </p>



                    <!-- =========================
                         BACK HOME
                    ========================= -->

                    <a
                        href="./index.html"

                        class="back-home"

                        data-ar="العودة إلى الصفحة الرئيسية"
                        data-en="Back to Home"
                    >
                        العودة إلى الصفحة الرئيسية
                    </a>


                </div>


            </section>


        </div>


    </main>



    <!-- =====================================================
         JAVASCRIPT

         Loading order is important:

         1. Official Supabase SDK
         2. BA Supabase client
         3. BA authentication logic
    ====================================================== -->


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
    ></script>


    <script
        src="./js/supabase.js"
    ></script>


    <script
        src="./js/auth.js"
    ></script>


</body>

</html>
