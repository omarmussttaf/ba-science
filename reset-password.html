<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">

    <title>BA Science | تعيين كلمة مرور جديدة</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

<main class="auth-page">

    <div class="auth-wrapper">

        <section class="auth-brand-panel">

            <a href="./index.html" class="auth-logo">
                <img src="./images/logo.svg"
                     alt="BA Science">
            </a>

            <div class="auth-brand-content">

                <h1
                    data-ar="أمّن حسابك العلمي"
                    data-en="Secure Your Scientific Account">
                    أمّن حسابك العلمي
                </h1>

                <p
                    data-ar="أنشئ كلمة مرور جديدة لحساب BA Science."
                    data-en="Create a new password for your BA Science account.">
                    أنشئ كلمة مرور جديدة لحساب BA Science.
                </p>

            </div>

        </section>

        <section class="auth-form-panel">

            <div class="auth-form-box">

                <div class="auth-top">

                    <div>
                        <span>BA SCIENCE</span>

                        <h2
                            data-ar="تعيين كلمة مرور جديدة"
                            data-en="Set a New Password">
                            تعيين كلمة مرور جديدة
                        </h2>
                    </div>

                    <button
                        id="languageButton"
                        class="language-button"
                        type="button">
                        EN
                    </button>

                </div>

                <form id="resetPasswordForm"
                      class="auth-form">

                    <div class="form-group">

                        <label
                            for="newPassword"
                            data-ar="كلمة المرور الجديدة"
                            data-en="New Password">
                            كلمة المرور الجديدة
                        </label>

                        <input
                            id="newPassword"
                            name="newPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="12"
                            maxlength="128"
                            required
                            disabled>

                    </div>

                    <div class="form-group">

                        <label
                            for="confirmNewPassword"
                            data-ar="تأكيد كلمة المرور الجديدة"
                            data-en="Confirm New Password">
                            تأكيد كلمة المرور الجديدة
                        </label>

                        <input
                            id="confirmNewPassword"
                            name="confirmNewPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="12"
                            maxlength="128"
                            required
                            disabled>

                    </div>

                    <button
                        id="resetPasswordButton"
                        type="submit"
                        class="auth-submit"
                        data-ar="حفظ كلمة المرور الجديدة"
                        data-en="Save New Password"
                        disabled>
                        حفظ كلمة المرور الجديدة
                    </button>

                    <p id="resetMessage"
                       role="status"
                       aria-live="polite"
                       data-ar="جارٍ التحقق من رابط الاستعادة..."
                       data-en="Verifying recovery link...">
                        جارٍ التحقق من رابط الاستعادة...
                    </p>

                </form>

                <p class="auth-switch">

                    <a href="./login.html"
                       data-ar="العودة إلى تسجيل الدخول"
                       data-en="Back to Sign In">
                        العودة إلى تسجيل الدخول
                    </a>

                </p>

            </div>

        </section>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/password-recovery.js"></script>

</body>
</html>
